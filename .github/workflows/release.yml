name: GitHub Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-release:
    name: Build, Test, and Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build

    - name: Build a binary wheel and a source tarball
      run: python -m build

    - name: Verify build
      run: |
        pip install dist/*.whl
        mkdir tmp_test
        cd tmp_test
        python -c "import pyquantflow; print('Successfully imported pyquantflow version:', pyquantflow.__version__)"

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: |
          dist/*.whl
          dist/*.tar.gz
        generate_release_notes: true

  docker-publish:
    name: Build & Publish Multi-Arch Images
    needs: build-and-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── quant-engine ─────────────────────────────────────────────
      - name: Extract metadata for quant-engine
        id: meta-engine
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/vespertili0/quant-engine
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}

      - name: Build and push quant-engine
        uses: docker/build-push-action@v6
        with:
          context: .
          target: engine
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-engine.outputs.tags }}
          labels: ${{ steps.meta-engine.outputs.labels }}
          cache-from: type=gha,scope=quant-engine
          cache-to: type=gha,mode=max,scope=quant-engine

      # ── quant-orchestrator ───────────────────────────────────────
      - name: Extract metadata for quant-orchestrator
        id: meta-orchestrator
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/vespertili0/quant-orchestrator
          tags: |
            type=semver,pattern={{version}},suffix=-prefect
            type=raw,value=latest-prefect,enable=${{ startsWith(github.ref, 'refs/tags/') }}

      - name: Build and push quant-orchestrator
        uses: docker/build-push-action@v6
        with:
          context: .
          target: orchestrator
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-orchestrator.outputs.tags }}
          labels: ${{ steps.meta-orchestrator.outputs.labels }}
          cache-from: type=gha,scope=quant-orchestrator
          cache-to: type=gha,mode=max,scope=quant-orchestrator
