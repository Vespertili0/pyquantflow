name: Tests

on:
  pull_request:
    branches: [ dev ]
    types: [ opened, synchronize, labeled ]

# Prevent redundant pipeline runs on rapid force-pushes
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Ensure linting and auto-fix immediately
  lint-and-auto-fix:
    name: Lint & Auto-fix
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Feature Branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref || github.event.pull_request.head.ref }}
          token: ${{ secrets.BOT_PAT_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pre-commit

      - name: Run pre-commit auto-fixes
        run: pre-commit run --all-files || true

      - name: Commit and push pre-commit auto-fixes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff-index --quiet HEAD || (git commit -m "style: pre-commit auto-fixes" && git push)

      - name: Verify pre-commit check passes
        uses: pre-commit/action@v3.0.1

  # Pytest runs, and conditionally uploads coverage
  pytest:
    name: Pytest (Python ${{ matrix.python-version }})
    needs: lint-and-auto-fix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - name: Checkout fresh code
        uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov
          pip install -e .

      - name: Set coverage core
        run: |
          echo "COVERAGE_CORE=sysmon" >> $GITHUB_ENV

      - name: Run Pytest (Coverage on 3.12 only)
        run: |
          if [ "${{ matrix.python-version }}" == "3.12" ]; then
            pytest --cov=pyquantflow --cov-branch --cov-report=xml
          else
            pytest
          fi

      - name: Upload coverage reports to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          verbose: true
          fail_ci_if_error: true
          skip_validation: true

  # Conditional Jules assessment
  jules:
    needs: pytest
    if: contains(github.event.pull_request.labels.*.name, 'gatecheck')
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
      statuses: write
    steps:
      - name: Checkout fresh code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install @google/jules-sdk

      - name: Run custom Jules review script
        run: node .github/scripts/jules_dev_pr_review.mjs
        env:
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
